[package]
name = "neongauge"
version = "0.3.0"
edition = "2021"
description = "Tiny pixel-art desktop tab that shows your Claude usage limits"

[dependencies]
eframe = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
dirs = "5"
notify-rust = "4.18.2"
auto-launch = "0.6.0"
raw-window-handle = "0.6"

[profile.release]
opt-level = 3
strip = true
lto = true

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = "0.26.1"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = ["Win32_Media_Audio", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
